<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d"><title id="t">QTDSA</title><desc id="d">Баннер: QTDSA, стадия концепции, 4 типа датчиков, 8–64 каналов, 4 фазы дорожной карты, ни одна не начата.</desc><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8ea0d6'/></marker><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient></defs><rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<text x="48" y="100" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="48" fill="#e6ecff" font-weight="800" text-anchor="start">QTDSA</text>
<text x="48" y="146" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8ea0d6" font-weight="500" text-anchor="start">Массив сенсоров отклонения времени квантового класса</text>
<text x="48" y="176" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4ecdc4" font-weight="600" text-anchor="start">Стадия концепции: только ТЗ, без оборудования и данных</text>
<rect x="48" y="210" width="256" height="64" rx="12" fill="#0b1430" stroke="#6f9bff" stroke-width="1.6"/>
<text x="64" y="238" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e6ecff" font-weight="700" text-anchor="start">4 типа датчиков</text>
<text x="64" y="260" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8ea0d6" font-weight="400" text-anchor="start">кварц, TCXO, OCXO, MCU</text>
<rect x="328" y="210" width="256" height="64" rx="12" fill="#0b1430" stroke="#6f9bff" stroke-width="1.6"/>
<text x="344" y="238" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e6ecff" font-weight="700" text-anchor="start">8–64 каналов</text>
<text x="344" y="260" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8ea0d6" font-weight="400" text-anchor="start">минимум–цель</text>
<rect x="608" y="210" width="256" height="64" rx="12" fill="#0b1430" stroke="#6f9bff" stroke-width="1.6"/>
<text x="624" y="238" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e6ecff" font-weight="700" text-anchor="start">4 фазы, ни одна не начата</text>
<text x="624" y="260" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8ea0d6" font-weight="400" text-anchor="start">дорожная карта</text>
<rect x="888" y="210" width="256" height="64" rx="12" fill="#0b1430" stroke="#6f9bff" stroke-width="1.6"/>
<text x="904" y="238" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e6ecff" font-weight="700" text-anchor="start">Концепция / проект</text>
<text x="904" y="260" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8ea0d6" font-weight="400" text-anchor="start">статус</text>
</svg>
