<text x="64" y="260" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8ea0d6" font-weight="400" text-anchor="start">quartz, TCXO, OCXO, MCU</text>
<rect x="328" y="210" width="256" height="64" rx="12" fill="#0b1430" stroke="#6f9bff" stroke-width="1.6"/>
