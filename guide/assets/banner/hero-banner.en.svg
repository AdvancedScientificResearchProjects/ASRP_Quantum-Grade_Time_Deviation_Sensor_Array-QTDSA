<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d"><title id="t">QTDSA</title><desc id="d">Hero banner: QTDSA concept stage, 4 sensor types, 8 to 64 channels, 4 roadmap phases, none started.</desc><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8ea0d6'/></marker><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient></defs><rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<text x="48" y="100" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="48" fill="#e6ecff" font-weight="800" text-anchor="start">QTDSA</text>
<text x="48" y="146" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8ea0d6" font-weight="500" text-anchor="start">Quantum-Grade Time Deviation Sensor Array</text>
<text x="48" y="176" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4ecdc4" font-weight="600" text-anchor="start">Concept stage: specification only, no hardware, firmware or data yet</text>
