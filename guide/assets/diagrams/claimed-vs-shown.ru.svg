<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">Заявлено и показано</title><desc id="d">Пять проектных утверждений README и их состояние в репозитории: проектные цели, формула, план и непроверенная патентная основа; ничего не измерено и не построено.</desc><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8ea0d6'/></marker><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient></defs><rect width="1200" height="400" rx="18" fill="url(#bg)"/>
<text x="24" y="84" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" font-weight="700" text-anchor="start">Тема</text>
<text x="200" y="84" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" font-weight="700" text-anchor="start">Что сказано в README (заявлено)</text>
<text x="700" y="84" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" font-weight="700" text-anchor="start">Состояние в репозитории</text>
<rect x="16" y="112" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="141" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Каналы</text>
<text x="200" y="141" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">Минимум 8, цель 16–64 каналов</text>
<text x="700" y="141" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">ПРОЕКТНАЯ ЦЕЛЬ: нет оборудования</text>
<rect x="16" y="168" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="197" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Разрешение</text>
<text x="200" y="197" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">≤ 10–50 пс (шаблон задачи: ≤ 50 пс)</text>
<text x="700" y="197" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">НЕ ПОКАЗАНО: нет измерений</text>
<rect x="16" y="224" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="253" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Модель задержек</text>
<text x="200" y="253" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">T_corrected = T_measured − T_cable − T_hw − T_comm</text>
<text x="700" y="253" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">ТОЛЬКО ФОРМУЛА: не проверена</text>
<rect x="16" y="280" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="309" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Дорожная карта</text>
<text x="200" y="309" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">4 фазы, интеграция атомных часов последней</text>
<text x="700" y="309" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">ТОЛЬКО ПЛАН: ни одна не начата</text>
<rect x="16" y="336" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="365" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Патентная основа</text>
<text x="200" y="365" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">Заявки нет; в README не утверждается</text>
<text x="700" y="365" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">НЕ УТВЕРЖДАЕТСЯ: поисковое</text>
</svg>
