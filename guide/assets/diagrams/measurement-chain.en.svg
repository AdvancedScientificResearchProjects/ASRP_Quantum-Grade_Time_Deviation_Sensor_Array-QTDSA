<text x="347" y="140" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">FPGA + TDC</text>
<text x="347" y="166" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">resolution ≤ 10–50 ps</text>
