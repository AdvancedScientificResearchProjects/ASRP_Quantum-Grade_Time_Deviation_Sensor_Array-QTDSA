<text x="56" y="104" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#e6ecff" font-weight="700" text-anchor="start">Oscillators</text>
<text x="56" y="140" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">quartz, TCXO, OCXO</text>
<text x="56" y="166" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">MCU: experimental</text>
<line x1="299" y1="145" x2="327" y2="145" stroke="#6f9bff" stroke-width="2" marker-end="url(#arr)"/>
<rect x="331" y="70" width="255" height="150" rx="12" fill="#0b1430" stroke="#34d399" stroke-width="1.6"/>
