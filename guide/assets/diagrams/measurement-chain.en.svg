<text x="638" y="140" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">T_corrected = T_meas −</text>
<text x="638" y="166" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">T_cable − T_hw − T_comm</text>
