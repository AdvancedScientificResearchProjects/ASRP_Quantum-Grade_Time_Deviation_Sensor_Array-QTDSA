<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">Claimed versus shown</title><desc id="d">Five design claims of the README and their state in the repository: design targets, a formula, a plan and an unasserted patent basis; nothing is measured or built.</desc><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8ea0d6'/></marker><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient></defs><rect width="1200" height="400" rx="18" fill="url(#bg)"/>
<text x="24" y="84" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" font-weight="700" text-anchor="start">Topic</text>
<text x="200" y="84" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" font-weight="700" text-anchor="start">What the README states (claim)</text>
<text x="700" y="84" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" font-weight="700" text-anchor="start">State in this repository</text>
<rect x="16" y="112" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="141" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Channels</text>
<text x="200" y="141" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">Minimum 8, target 16–64 channels</text>
<text x="700" y="141" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">DESIGN TARGET: no hardware</text>
<rect x="16" y="168" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="197" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Resolution</text>
<text x="200" y="197" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">≤ 10–50 ps (issue template: ≤ 50 ps)</text>
<text x="700" y="197" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">NOT SHOWN: no measurement</text>
<rect x="16" y="224" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="253" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Delay model</text>
<text x="200" y="253" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">T_corrected = T_measured − T_cable − T_hw − T_comm</text>
<text x="700" y="253" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">FORMULA ONLY: not validated</text>
<rect x="16" y="280" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="309" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Roadmap</text>
<text x="200" y="309" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">4 phases, atomic clock integration last</text>
<text x="700" y="309" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">PLAN ONLY: none started</text>
<rect x="16" y="336" width="1168" height="46" rx="10" fill="#0b1430" stroke="#6f9bff" stroke-width="1"/>
<text x="24" y="365" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6ecff" font-weight="700" text-anchor="start">Patent basis</text>
<text x="200" y="365" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8ea0d6" font-weight="400" text-anchor="start">No filing; none asserted in the README</text>
<text x="700" y="365" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffa657" font-weight="700" text-anchor="start">NOT ASSERTED: exploratory</text>
</svg>
